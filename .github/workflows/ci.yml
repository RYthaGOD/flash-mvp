name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build and test Solana program
  solana-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install libudev-dev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache Cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.17.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          
      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked
          
      - name: Build Solana Program
        run: |
          anchor build
          
      - name: Run Solana Tests
        run: |
          echo "Solana tests would run here (requires local validator)"

  # Build and test backend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package.json
          
      - name: Install dependencies
        working-directory: backend
        run: npm install
        
      - name: Run backend tests
        working-directory: backend
        run: npm test || echo "No tests configured yet"

  # Build and test frontend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
          
      - name: Install dependencies
        working-directory: frontend
        run: npm install
        
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests

  # Lint check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
        
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
        
      - name: Lint backend
        working-directory: backend
        run: npm run lint || echo "No lint script configured"
        
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint || echo "No lint script configured"
